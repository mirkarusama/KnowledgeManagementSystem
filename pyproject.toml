[project]
name = "kms"
version = "0.1.0"
description = "Agentic Knowledge Management pilot: LangGraph + MCP, find-then-confirm access control"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.16",
  "langgraph-checkpoint-postgres==3.2.0",
  "langchain-mcp-adapters==0.3.2",
  "mcp==1.30.0",
  "langchain-openai==1.7.2",
  "langchain-core==1.6.12",
  "openai==3.35.1",
  "qdrant-client==1.19.1",
  "fastapi==0.153.0",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.1",
  "psycopg[binary]==3.2.13",
  "psycopg-pool==3.3.3",
  "redis==8.1.0",
  "pyjwt[crypto]==2.15.1",
  "httpx==0.28.1",
  "prometheus-client==0.26.0",
  "sse-starlette==3.5.0",
]

[project.optional-dependencies]
# Heavy extras. Off by default so the stack fits a laptop; turn on in production.
docling = ["docling"]
presidio = ["presidio-analyzer", "presidio-anonymizer"]
langfuse = ["langfuse"]
eval = ["ragas", "deepeval", "datasets"]
dev = ["pytest", "pytest-asyncio", "fakeredis"]

[project.scripts]
kms = "kms.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kms*"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
