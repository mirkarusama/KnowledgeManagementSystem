{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kms-{{ $name }}
  labels: {{- include "kms.labels" $ | nindent 4 }}
    app.kubernetes.io/name: kms-{{ $name }}
spec:
  replicas: {{ $svc.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: kms-{{ $name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kms-{{ $name }}, app.kubernetes.io/part-of: kms }
      annotations:
        checksum/config: {{ toJson $.Values.config | sha256sum }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: {{ $name }}
          image: {{ $.Values.image.backend }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: {{ toJson $svc.command }}
          envFrom:
            - configMapRef: { name: kms-config }
            - secretRef: { name: kms-secrets }
          {{- if $svc.port }}
          ports: [{ containerPort: {{ $svc.port }}, name: http }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 20, failureThreshold: 6 }
          {{- end }}
          resources: {{- toYaml $svc.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
{{- if $svc.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: kms-{{ $name }}
  labels: {{- include "kms.labels" $ | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: kms-{{ $name }} }
  ports: [{ port: {{ $svc.port }}, targetPort: http, name: http }]
{{- end }}
{{- if and $svc.hpa $svc.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kms-{{ $name }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: kms-{{ $name }} }
  minReplicas: {{ $svc.hpa.min }}
  maxReplicas: {{ $svc.hpa.max }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ $svc.hpa.cpu }} } } }]
{{- end }}
{{- end }}
