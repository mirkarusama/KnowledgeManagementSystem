apiVersion: apps/v1
kind: Deployment
metadata:
  name: kms-web
  labels: {{- include "kms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: kms-web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kms-web, app.kubernetes.io/part-of: kms } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: web
          image: {{ .Values.image.web }}
          env:
            - { name: NEXT_PUBLIC_API_URL, value: {{ .Values.web.apiUrl | quote }} }
            - { name: NEXT_PUBLIC_OIDC_AUTHORITY, value: {{ .Values.web.oidcAuthority | quote }} }
            - { name: NEXT_PUBLIC_OIDC_CLIENT_ID, value: kms-web }
          ports: [{ containerPort: 3000, name: http }]
          readinessProbe: { httpGet: { path: /api/config, port: http } }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: kms-web }
spec:
  selector: { app.kubernetes.io/name: kms-web }
  ports: [{ port: 3000, targetPort: http, name: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kms
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"   # keep answers streaming
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls: [{ hosts: [{{ .Values.web.host }}, {{ .Values.web.apiHost }}], secretName: kms-tls }]
  {{- end }}
  rules:
    - host: {{ .Values.web.host }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: kms-web, port: { number: 3000 } } } }] }
    - host: {{ .Values.web.apiHost }}
      http: { paths: [{ path: /api, pathType: Prefix, backend: { service: { name: kms-agent-api, port: { number: 8000 } } } }] }
