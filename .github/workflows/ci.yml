name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q tests/test_units.py
      - name: Policy tests (OPA)
        run: docker run --rm -v $PWD/policies:/p openpolicyagent/opa:1.4.2-static test /p -v
  e2e:
    # Full stack in demo mode: access-control suite (100% required) + golden-set gate.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build postgres qdrant valkey opa keycloak litellm demo-llm mock-atlassian mcp-atlassian agent-api ingest-receiver
      - run: sleep 40 && docker compose exec -T agent-api kms index-all
      - name: Access-control suite
        run: docker compose exec -T -e KMS_E2E=1 -e KMS_JIRA_URL=http://mock-atlassian:9000 agent-api sh -c "pip install -q pytest pytest-asyncio && python -m pytest -q /app/tests/test_access_control_e2e.py"
      - name: Golden-set evaluation gate
        run: docker compose exec -T agent-api python /app/eval/run_eval.py --api http://localhost:8000 --out /tmp/report.json
      - name: SBOM + vulnerability scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:latest kms-pilot/backend:0.1.0 -o spdx-json > sbom.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 0 kms-pilot/backend:0.1.0
      - if: always()
        run: docker compose logs --tail=200
